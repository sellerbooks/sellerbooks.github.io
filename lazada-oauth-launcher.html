<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SellerBooks - Hubungkan Lazada</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f8fafc;color:#0f172a;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{width:min(420px,calc(100vw - 40px));background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(15,23,42,.12);text-align:center}
.icon{width:64px;height:64px;margin:0 auto 16px;border-radius:16px;background:#fff1f2;display:flex;align-items:center;justify-content:center;font-size:32px}
h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#64748b;line-height:1.6;margin:0}.error{margin-top:18px;background:#fef2f2;color:#b91c1c;border-radius:10px;padding:12px;font-size:12px;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <div class="icon">🛍️</div>
  <h1>Menghubungkan ke Lazada</h1>
  <p id="status">Menyiapkan halaman otorisasi resmi Lazada...</p>
  <div id="error" class="error" style="display:none"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://fysaxpqpqexjnlpkbwap.supabase.co";
const SUPABASE_KEY="sb_publishable_DWRaEZTcNMjhglwN3nqCOw_pua8rsjD";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const params=new URLSearchParams(location.search);
const storeId=params.get("store_id")||"";
const marketplaceId=params.get("marketplace_id")||"";
const statusEl=document.getElementById("status");
const errorEl=document.getElementById("error");

function showError(message){
  statusEl.textContent="Lazada tidak dapat dihubungkan.";
  errorEl.textContent=message;
  errorEl.style.display="block";
}

(async function(){
  try{
    if(!storeId||!marketplaceId){
      showError("store_id dan marketplace_id wajib tersedia.");
      return;
    }

    const {data:{session}}=await supabaseClient.auth.getSession();

    if(!session?.access_token){
      showError("Sesi SellerBooks tidak ditemukan. Silakan tutup popup, login kembali, lalu coba lagi.");
      return;
    }

    const response=await fetch(
      SUPABASE_URL+"/functions/v1/sellerbooks-lazada-oauth?action=init",
      {
        method:"POST",
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+session.access_token,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({
          store_id:storeId,
          marketplace_id:marketplaceId
        })
      }
    );

    const data=await response.json().catch(()=>({}));

    if(!response.ok||!data.ok||!data.authorization_url){
      showError(data.error||"OAuth Lazada belum siap dikonfigurasi.");
      return;
    }

    statusEl.textContent="Membuka halaman login dan otorisasi resmi Lazada...";
    window.location.replace(data.authorization_url);

  }catch(error){
    console.error(error);
    showError("Terjadi kesalahan saat menyiapkan OAuth Lazada.");
  }
})();
</script>
</body>
</html>
