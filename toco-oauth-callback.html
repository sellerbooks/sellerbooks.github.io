<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>SellerBooks - Menyelesaikan Integrasi Toco</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8fafc;color:#0f172a;font-family:Arial,Helvetica,sans-serif}.card{width:min(440px,calc(100% - 32px));background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:30px 24px;text-align:center;box-shadow:0 12px 36px #0f172a0d}.spinner{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}h1{font-size:22px;margin:0 0 10px}p{font-size:14px;line-height:1.6;color:#64748b;margin:0}.error{color:#b91c1c}@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main class="card">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Menyelesaikan integrasi Toco</h1>
  <p id="message">Memverifikasi kredensial toko dengan aman...</p>
</main>
<script>
(async function(){
  const title=document.getElementById("title"), message=document.getElementById("message"), spinner=document.getElementById("spinner");
  const params=new URLSearchParams(location.search);
  const state=params.get("state")||"";
  const sid=params.get("sid")||"";
  const storeAccess=params.get("storeAccess")||"";
  // Remove encrypted credential and state from the visible URL/history immediately.
  history.replaceState(null,"",location.pathname);
  const fail=(text)=>{spinner.style.display="none";title.textContent="Integrasi Toco belum selesai";title.className="error";message.textContent=text;};
  if(!state||!sid||!storeAccess){fail("Data otorisasi tidak lengkap. Silakan tutup popup dan mulai integrasi kembali dari SellerBooks.");return;}
  try{
    const response=await fetch("https://fysaxpqpqexjnlpkbwap.supabase.co/functions/v1/sellerbooks-toco?action=complete",{
      method:"POST",
      headers:{"Content-Type":"application/json","apikey":"sb_publishable_DWRaEZTcNMjhglwN3nqCOw_pua8rsjD"},
      body:JSON.stringify({state,sid,storeAccess})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||!data.ok)throw new Error(data.error||"SellerBooks tidak dapat menyimpan kredensial Toco.");
    title.textContent="Integrasi Toco berhasil";
    message.textContent="Toko "+(data.store_name||"Toco")+" berhasil dihubungkan. Anda dapat menutup popup ini dan kembali ke SellerBooks.";
    spinner.style.display="none";
    if(window.opener&&!window.opener.closed){
      window.opener.postMessage({source:"sellerbooks-toco-oauth",status:"success",store_name:data.store_name||"Toco"},location.origin);
    }
    setTimeout(()=>{try{window.close();}catch(e){}},1800);
  }catch(e){fail(e&&e.message?e.message:"Terjadi kesalahan saat menyelesaikan integrasi.");}
})();
</script>
</body>
</html>
