<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SellerBooks - Integrasi Marketplace</title>
<style>
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#0f172a}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:32px 24px;max-width:450px}
.spinner{width:34px;height:34px;border:4px solid #e2e8f0;border-top-color:#0f172a;border-radius:50%;margin:0 auto 20px;animation:spin .8s linear infinite}
h1{font-size:24px;margin:0 0 12px}
p{font-size:14px;line-height:1.6;color:#64748b;margin:0}
.error{display:none}.error h1{color:#b91c1c}.coming{display:none}.coming h1{color:#2563eb}.soon-icon{font-size:42px;margin-bottom:14px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="loading">
  <div class="spinner"></div>
  <h1 id="title">Menyiapkan integrasi marketplace</h1>
  <p id="message">Memeriksa koneksi akun SellerBooks...</p>
</div>
<div class="box error" id="errorBox">
  <h1>Integrasi gagal dimulai</h1>
  <p id="errorText"></p>
</div>
<div class="box coming" id="comingBox">
  <div class="soon-icon">🚀</div>
  <h1>Segera Hadir</h1>
  <p id="comingText">Integrasi marketplace ini sedang dipersiapkan.</p>
</div>
<script>
(function(){
  const SUPABASE_URL="https://fysaxpqpqexjnlpkbwap.supabase.co";
  const SUPABASE_KEY="sb_publishable_DWRaEZTcNMjhglwN3nqCOw_pua8rsjD";
  const PROJECT_REF="fysaxpqpqexjnlpkbwap";

  const PROVIDERS={
    tiktok:{label:"TikTok Shop",endpoint:"sellerbooks-tiktok-oauth"},
    shopee:{label:"Shopee",endpoint:"sellerbooks-shopee-oauth"},
    lazada:{label:"Lazada",endpoint:"sellerbooks-lazada-oauth"}
  };

  function fail(message){
    document.getElementById("loading").style.display="none";
    document.getElementById("errorBox").style.display="block";
    document.getElementById("errorText").textContent=message||"Integrasi marketplace tidak dapat dimulai.";
  }

  function showComingSoon(name){
    document.getElementById("loading").style.display="none";
    document.getElementById("errorBox").style.display="none";
    document.getElementById("comingBox").style.display="block";
    document.getElementById("comingText").textContent=
      "Integrasi " + (name||"marketplace") +
      " belum tersedia saat ini. Fitur sinkronisasi API akan segera hadir setelah konektor/API resmi SellerBooks siap. " +
      "Sementara Anda bisa melakukan upload file orderan marketplace secara manual melalui Import Penjualan.";
  }

  function detectMarketplace(name){
    const n=String(name||"").toLowerCase();
    if(n.includes("tiktok"))return "tiktok";
    if(n.includes("shopee"))return "shopee";
    if(n.includes("lazada"))return "lazada";
    if(n.includes("blibli"))return "blibli";
    if(n.includes("toco"))return "toco";
    if(n.includes("tokopedia"))return "tokopedia";
    return "";
  }

  function readSellerBooksAccessToken(){
    const exactKey="sb-"+PROJECT_REF+"-auth-token";
    const candidates=[exactKey];

    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key && key.startsWith("sb-"+PROJECT_REF+"-auth-token") && !candidates.includes(key)){
        candidates.push(key);
      }
    }

    for(const key of candidates){
      try{
        const raw=localStorage.getItem(key);
        if(!raw)continue;
        const parsed=JSON.parse(raw);
        const token=parsed?.access_token || parsed?.currentSession?.access_token || parsed?.session?.access_token;
        if(token)return token;
      }catch(e){}
    }
    return "";
  }

  async function start(){
    try{
      const params=new URLSearchParams(location.search);
      const storeId=params.get("store_id")||"";
      const marketplaceId=params.get("marketplace_id")||"";
      const marketplaceName=params.get("marketplace_name")||"";

      if(!storeId||!marketplaceId)throw new Error("store_id dan marketplace_id tidak tersedia.");

      const type=detectMarketplace(marketplaceName);
      if(!type)throw new Error("Marketplace tidak dikenali.");

      // Hanya TikTok Shop dan Lazada yang saat ini sudah aktif.
      // Shopee, Blibli, Toco, Tokopedia, dan marketplace lain yang belum
      // memiliki API resmi SellerBooks ditampilkan sebagai "Segera Hadir".
      // Jangan tampilkan error teknis untuk marketplace yang belum tersedia.
      if(type!=="tiktok" && type!=="lazada"){
        showComingSoon(marketplaceName||type);
        return;
      }

      const provider=PROVIDERS[type];
      if(!provider){
        showComingSoon(marketplaceName||type);
        return;
      }

      document.getElementById("title").textContent="Menghubungkan "+provider.label;
      document.getElementById("message").textContent="Menyiapkan autentikasi resmi "+provider.label+"...";

      // Jangan memuat SDK Supabase di popup. Launcher ini satu-origin dengan
      // sellerbooks.github.io, jadi session Supabase yang dibuat halaman utama
      // dapat dibaca langsung dari localStorage. Ini menghindari error
      // "s.createClient is not a function" dari dynamic import CDN.
      const accessToken=readSellerBooksAccessToken();
      if(!accessToken)throw new Error("Sesi SellerBooks tidak tersedia. Silakan login kembali.");

      // Pastikan token masih valid sebelum memanggil Edge Function.
      const userResponse=await fetch(SUPABASE_URL+"/auth/v1/user",{
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+accessToken
        }
      });
      if(!userResponse.ok)throw new Error("Sesi SellerBooks sudah berakhir. Silakan login kembali.");

      const response=await fetch(
        SUPABASE_URL+"/functions/v1/"+provider.endpoint+"?action=init",
        {
          method:"POST",
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":"Bearer "+accessToken,
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            store_id:storeId,
            marketplace_id:marketplaceId,
            marketplace_name:marketplaceName
          })
        }
      );

      const data=await response.json().catch(()=>({}));
      if(!response.ok||!data.authorization_url){
        throw new Error(data.error||("OAuth "+provider.label+" tidak dapat dimulai."));
      }

      location.replace(data.authorization_url);
    }catch(error){
      console.error(error);
      fail(error?.message||"Integrasi marketplace tidak dapat dimulai.");
    }
  }

  // Teruskan hasil OAuth dari callback marketplace ke halaman SellerBooks utama.
  // Struktur desktop: index.html -> launcher popup -> OAuth -> callback -> launcher -> index.html
  window.addEventListener("message", function(event){
    if(event.origin !== window.location.origin){
      return;
    }

    const data = event.data || {};
    if(
      data.source !== "sellerbooks-tiktok-oauth" &&
      data.source !== "sellerbooks-shopee-oauth" &&
      data.source !== "sellerbooks-lazada-oauth"
    ){
      return;
    }

    try{
      if(window.opener && !window.opener.closed){
        window.opener.postMessage(data, window.location.origin);
      }
    }catch(e){
      console.warn("Gagal meneruskan hasil OAuth ke SellerBooks:", e);
    }

    setTimeout(function(){
      try{ window.close(); }catch(e){}
    }, 500);
  });

  // Dalam session-bridge baru, OAuth INIT sudah dijalankan oleh
  // halaman SellerBooks asal. Launcher hanya menjadi halaman sementara
  // sampai parent mengarahkannya ke authorization_url.
  const params = new URLSearchParams(location.search);
  const handoff = params.get("handoff");
  const authorizationUrl = params.get("authorization_url") || "";

  if(handoff === "windows" && authorizationUrl){
    try{
      const auth = new URL(authorizationUrl);
      if(auth.protocol !== "https:") throw new Error("URL otorisasi marketplace tidak valid.");
      const marketplaceName = params.get("marketplace_name") || "Marketplace";
      document.getElementById("title").textContent="Membuka " + marketplaceName;
      document.getElementById("message").textContent="Memuat halaman login resmi " + marketplaceName + "...";
      window.location.replace(auth.href);
    }catch(error){
      fail(error?.message || "URL otorisasi marketplace tidak valid.");
    }
  }else if(handoff === "pending"){
    document.getElementById("title").textContent="Menyiapkan halaman otorisasi";
    document.getElementById("message").textContent="Menghubungkan ke halaman login resmi marketplace...";
  }else{
    start();
  }
})();
</script>
</body>
</html>
